version: 2
builds:
  - id: sleeping-beauty
    main: ./cmd/sleepingd
    binary: sleepingd
    goos:
      - darwin
      - linux
nfpms:
  - vendor: Radian LLC
    maintainer: &author Radian LLC <contact+sleeping-beauty@radian.codes>
    description: &description Webserver auto-sleep for containerized environments
    license: &license MIT
    formats:
      - apk
      - deb
      - rpm
dockers_v2:
  - images:
      - radiansoftware/sleeping-beauty
    tags:
      - latest
      - "{{ .Tag }}"
checksum:
  name_template: "checksums.txt"
